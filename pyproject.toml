[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocm"
version = "0.1.0"
description = "Ontology-Constrained Memory (OCM): a write-time governed memory layer for long-horizon LLM agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OCM" }]
keywords = ["memory", "ontology", "agents", "llm", "knowledge-graph"]

dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6,<3",
    "networkx>=3.2",
    "chromadb>=0.4.24",
    "sentence-transformers>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ocm*"]

[tool.pytest.ini_options]
testpaths = ["ocm/tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "property(n, text): tags a test as validating correctness Property n (Feature: ontology-constrained-memory, Property n: text).",
]

[tool.hypothesis]
max_examples = 100
